# SNS AutoJoin 백엔드 Nginx 설정 블록
# 기존 /etc/nginx/sites-available/wordpress 파일 내부에 아래 블록을 추가하세요.
# (server {} 블록 안에 location 블록들과 함께)

    # ── SNS AutoJoin FastAPI 백엔드 프록시 (/snsauto/) ──────────────────
    location /snsauto/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # 타임아웃 설정 (AI 생성은 최대 120초 소요될 수 있음)
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;

        # CORS 헤더 (Nginx 레벨 이중 보안)
        add_header Access-Control-Allow-Origin  "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
    # ── SNS AutoJoin 프록시 끝 ──────────────────────────────────────────
