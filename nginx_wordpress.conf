server {
    listen 80;
    listen 443 ssl;
    server_name jcom.ai.kr *.jcom.ai.kr;
    root /var/www/html/wordpress;
    index index.php index.html;
    client_max_body_size 64M;

    ssl_certificate /etc/letsencrypt/live/jcom.ai.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jcom.ai.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip 전송 압축 최적화
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # SNS AutoPost 프론트엔드
    location ^~ /sns {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /sns/index.html;
    }

    # SNS AutoPost 백엔드 API 프록시
    location ^~ /snsauto/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
    }

    # TikTok 도메인 인증 파일 (txt 파일 직접 서빙)
    location ~ ^/tiktok.*\.txt$ {
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # 정적 리소스 브라우저 캐싱 30일
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|woff2|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    location ~ /\. { deny all; }
}
